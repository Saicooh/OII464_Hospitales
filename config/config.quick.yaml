# Small deterministic comparison using the historical CSV and plot format.
instance:
  path: instances/didactic/HOSP-DIDACT-03-01.yaml

experiment:
  num_simulations: 1
  n_jobs: 1
  alpha_test: 0.05
  std_factor_times: 0.15
  save_pdf: false
  output_dirs:
    csv: results/elective/csv
    plots: results/elective/plots

algorithms:
  alpha: 1.0e-6
  beta: 0.5
  gamma: 1.4
  delta: 100.0
  ga:
    enabled: true
    max_generations: 5
    population_size: 5
    crossover_probability: 0.8
    mutation_probability: 0.3
    elitism_count: 1
  dpso:
    enabled: true
    max_iterations: 5
    swarm_size: 5
    w: 0.7
    c1: 1.5
    c2: 1.5
    vel_low: -4.0
    vel_high: 4.0
  sboa:
    enabled: true
    max_iterations: 5
    population_size: 5
    lower_bound: -5.0
    upper_bound: 5.0
  dmshoa:
    enabled: true
    max_iterations: 5
    population_size: 5
    k: 0.3
    lower_bound: -5.0
    upper_bound: 5.0
  mh:
    enabled: false
    max_iterations: 3
    population_size: 3
logging:
  verbose_mode: false
